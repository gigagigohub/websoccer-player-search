  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;style&gt;
.factor-viz {
  --ink: var(--foreground);
  --muted: var(--muted-foreground);
  --grid: var(--border);
  --surface: var(--background);
  --cc: var(--viz-series-1);
  --rohm: var(--viz-series-2);
  --combined: var(--viz-series-3);
  position: relative;
  width: 100%;
  max-width: 920px;
  min-width: 0;
  margin: 0 auto;
  overflow-x: clip;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans JP&quot;, sans-serif;
  line-height: 1.45;
}
.factor-viz * { box-sizing: border-box; }
.factor-viz .eyebrow {
  margin: 0 0 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.factor-viz h2 {
  margin: 0;
  font-size: clamp(20px, 4vw, 30px);
  line-height: 1.18;
  letter-spacing: -.02em;
}
.factor-viz .lede {
  max-width: 760px;
  margin: 8px 0 16px;
  color: var(--muted);
  font-size: 13px;
}
.factor-viz .controls {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 8px;
}
.factor-viz label {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
}
.factor-viz select {
  min-width: 190px;
}
.factor-viz .legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
}
.factor-viz .legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.factor-viz .legend button[aria-pressed=&quot;false&quot;] { opacity: .35; }
.factor-viz .legend button:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
.factor-viz .swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--swatch); }
.factor-viz .model-line {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.factor-viz .summary {
  margin: 5px 0 2px;
  min-height: 22px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.factor-viz .plot-wrap { position: relative; width: 100%; }
.factor-viz svg { display: block; width: 100%; height: 500px; overflow: visible; }
.factor-viz .axis text, .factor-viz .row-label { fill: var(--muted); font-size: 11px; }
.factor-viz .axis path { display: none; }
.factor-viz .axis line { stroke: var(--grid); }
.factor-viz .zero { stroke: var(--ink); stroke-width: 1.1; opacity: .58; }
.factor-viz .row-rule { stroke: var(--grid); stroke-width: 1; opacity: .65; }
.factor-viz .chart-frame { fill: none; stroke: var(--grid); stroke-width: 1; }
.factor-viz .interval { stroke-width: 2; stroke-linecap: round; }
.factor-viz .point { stroke: var(--surface); stroke-width: 1.5; }
.factor-viz .status-unclear { opacity: .48; }
.factor-viz .status-suggestive { opacity: .78; }
.factor-viz .status-unidentified, .factor-viz .status-model_not_validated, .factor-viz .status-sensitivity_unstable { opacity: .18; }
.factor-viz .foot {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11px;
}
.factor-viz .tooltip {
  position: absolute;
  z-index: 5;
  width: min(250px, calc(100vw - 36px));
  padding: 9px 10px;
  border: 1px solid var(--grid);
  border-radius: 8px;
  background: var(--popover);
  color: var(--popover-foreground);
  font-size: 12px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .12s ease, transform .12s ease;
}
.factor-viz .tooltip.on { opacity: 1; transform: translateY(0); }
.factor-viz .tooltip strong { display: block; margin-bottom: 3px; }
.factor-viz .tooltip span { color: var(--muted); }
@media (max-width: 520px) {
  .factor-viz .controls { align-items: stretch; flex-direction: column; }
  .factor-viz select { width: 100%; min-width: 0; }
  .factor-viz .legend { justify-content: flex-start; }
  .factor-viz .lede { font-size: 12px; }
  .factor-viz svg { height: 470px; }
}
&lt;/style&gt;

uot;unidentified&quot;,7.0,7.0,0.0,null,null,&quot;unidentified&quot;,&quot;&quot;],[&quot;oa&quot;,0.456932,0.213836,0.700029,&quot;supported&quot;,6.0,7.0,0.09401,-0.071566,0.259586,&quot;model_not_validated&quot;,6.0,7.0,0.456932,0.213836,0.700029,&quot;suggestive&quot;,&quot;CC&quot;]]}];

    Object.keys(defs).forEach(key =&gt; {
      if (!active.has(key)) return;

      const layer = g.append(&quot;g&quot;).attr(&quot;data-series&quot;,key);

        .attr(&quot;class&quot;,r =&gt; &quot;status-&quot; + r[d.st])
        .attr(&quot;transform&quot;,r =&gt; &quot;translate(0,&quot; + (y(r[0]) + y.bandwidth()/2 + d.offset) + &quot;)&quot;);

      marks.append(&quot;line&quot;).attr(&quot;x1&quot;,r =&gt; x(r[d.l])).attr(&quot;x2&quot;,r =&gt; x(r[d.h]))

        .style(&quot;pointer-events&quot;,&quot;stroke&quot;)

        .on(&quot;pointermove&quot;,(event,r) =&gt; showTip(event,r,key))
        .on(&quot;pointerleave&quot;,hideTip);

    g.append(&quot;text&quot;).attr(&quot;class&quot;,&quot;axis-title&quot;).attr(&quot;data-axis&quot;,&quot;x&quot;)
