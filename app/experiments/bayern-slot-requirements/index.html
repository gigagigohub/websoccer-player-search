  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

  flex: none;
  margin: 0 !important;

}

.text-warning,

  color: var(--destructive);
}

&lt;style&gt;
#bayern-slot-factor-viz {
  --ink: var(--foreground);
  --muted: var(--muted-foreground);
  --grid: var(--border);
  --surface: var(--background);
  --cc: var(--viz-series-1);
  --rohm: var(--viz-series-2);
  --combined: var(--viz-series-3);
  --speed: #76bbff;
  --technique: #83db71;
  --power: #ff876f;
  --speed-fill: linear-gradient(180deg, #4fb2ff 0%, #1f2ea7 100%);
  --technique-fill: linear-gradient(180deg, #67d847 0%, #1f7d39 100%);
  --power-fill: linear-gradient(180deg, #ff6542 0%, #b82214 100%);

  width: 100%;

  min-width: 0;
  margin: 0 auto;
  overflow-x: clip;

  line-height: 1.45;
}
#bayern-slot-factor-viz * { box-sizing: border-box; }
#bayern-slot-factor-viz .eyebrow {
  margin: 0 0 4px;

  font-size: 12px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
#bayern-slot-factor-viz h2 {
  margin: 0;
  font-size: clamp(20px, 4vw, 30px);
  line-height: 1.18;
  letter-spacing: -.02em;
}
#bayern-slot-factor-viz .lede {
  max-width: 780px;
  margin: 8px 0 15px;
  color: var(--muted);
  font-size: 13px;
}
#bayern-slot-factor-viz .controls {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
#bayern-slot-factor-viz label {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 11px;
}
#bayern-slot-factor-viz select { min-width: 200px; }
#bayern-slot-factor-viz .legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 4px 10px;
}
#bayern-slot-factor-viz .legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
#bayern-slot-factor-viz .legend button[aria-pressed=&quot;false&quot;] { opacity: .35; }
#bayern-slot-factor-viz .legend button:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
#bayern-slot-factor-viz .swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--swatch); }
#bayern-slot-factor-viz .model-line {
  margin: 3px 0 14px;
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
#bayern-slot-factor-viz .analysis-block { margin: 0 0 20px; }
#bayern-slot-factor-viz .analysis-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 2px;
}
#bayern-slot-factor-viz h3 {
  margin: 0;
  font-size: 15px;
  line-height: 1.3;
}
#bayern-slot-factor-viz .section-summary {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  text-align: right;
}
#bayern-slot-factor-viz .plot-wrap { position: relative; width: 100%; }
#bayern-slot-factor-viz svg { display: block; width: 100%; overflow: visible; }
#bayern-slot-factor-viz .stp-share-row { margin: 10px 0 16px; }
#bayern-slot-factor-viz .stp-share-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
#bayern-slot-factor-viz .stp-share-head { margin-bottom: 5px; font-size: 12px; }
#bayern-slot-factor-viz .stp-share-status { color: var(--muted); font-size: 11px; }
#bayern-slot-factor-viz .stp-axis-grid {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) 42px;
  gap: 6px 8px;
  align-items: center;
  width: 100%;
}
#bayern-slot-factor-viz .stp-axis-scale {
  grid-column: 2;
  display: flex;
  justify-content: space-between;
  margin-bottom: -3px;
  color: var(--muted);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}
#bayern-slot-factor-viz .stp-axis-row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) 42px;
  gap: 8px;
  align-items: center;
}
#bayern-slot-factor-viz .stp-axis-label {
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}
#bayern-slot-factor-viz .stp-axis-label[data-feature=&quot;S&quot;] { color: var(--speed); }
#bayern-slot-factor-viz .stp-axis-label[data-feature=&quot;T&quot;] { color: var(--technique); }
#bayern-slot-factor-viz .stp-axis-label[data-feature=&quot;P&quot;] { color: var(--power); }
#bayern-slot-factor-viz .stp-axis-track {
  position: relative;
  width: 100%;
  height: 13px;
  overflow: hidden;
  background: var(--grid);
  border-radius: 2px;
}
#bayern-slot-factor-viz .stp-axis-track::after {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0,
    transparent calc(10% - 2px),
    var(--surface) calc(10% - 2px),
    var(--surface) 10%
  );
  opacity: .62;
  pointer-events: none;
  content: &quot;&quot;;
}
#bayern-slot-factor-viz .stp-axis-fill { height: 100%; min-width: 0; }
#bayern-slot-factor-viz .stp-axis-fill[data-feature=&quot;S&quot;] { background: var(--speed-fill); }
#bayern-slot-factor-viz .stp-axis-fill[data-feature=&quot;T&quot;] { background: var(--technique-fill); }
#bayern-slot-factor-viz .stp-axis-fill[data-feature=&quot;P&quot;] { background: var(--power-fill); }
#bayern-slot-factor-viz .stp-axis-value {
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
#bayern-slot-factor-viz .stp-share-note {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
}
#bayern-slot-factor-viz .row-label { fill: var(--ink); font-size: 11px; font-weight: 600; }
#bayern-slot-factor-viz .row-status,
#bayern-slot-factor-viz .endpoint-label,
#bayern-slot-factor-viz .axis-title { fill: var(--muted); font-size: 10px; }
#bayern-slot-factor-viz .zero { stroke: var(--ink); stroke-width: 1.1; opacity: .58; }
#bayern-slot-factor-viz .direction-track { stroke: var(--grid); stroke-width: 2; stroke-linecap: round; }
#bayern-slot-factor-viz .point { stroke: var(--surface); stroke-width: 1.5; }
#bayern-slot-factor-viz .status-unclear { opacity: .46; }
#bayern-slot-factor-viz .status-suggestive { opacity: .78; }

#bayern-slot-factor-viz .status-sensitivity_unstable,

#bayern-slot-factor-viz .foot {

  font-size: 11px;
}

&lt;script&gt;
(function () {
  const DATA = JSON.parse(document.getElementById(&quot;bayern-factor-data&quot;).textContent);
  const root = document.getElementById(&quot;bayern-slot-factor-viz&quot;);
  const select = root.querySelector(&quot;#factor-slot&quot;);
  const tip = root.querySelector(&quot;#factor-tip&quot;);
  const active = new Set([&quot;co&quot;]);
  const defs = {
    cc: {name:&quot;CC&quot;, color:&quot;var(--cc)&quot;, offset:-6},
    rh: {name:&quot;Rohm&quot;, color:&quot;var(--rohm)&quot;, offset:6},
    co: {name:&quot;統合&quot;, color:&quot;var(--combined)&quot;, offset:0}
  };
  const rowMeta = {
    core:{center:&quot;S/T/P総合&quot;, left:&quot;低め&quot;, right:&quot;高め&quot;},
    Sd:{center:&quot;S配分&quot;, left:&quot;S控えめ&quot;, right:&quot;S寄り&quot;},
    Td:{center:&quot;T配分&quot;, left:&quot;T控えめ&quot;, right:&quot;T寄り&quot;},
    Pd:{center:&quot;P配分&quot;, left:&quot;P控えめ&quot;, right:&quot;P寄り&quot;},
    St:{center:&quot;スタミナ&quot;, left:&quot;低め&quot;, right:&quot;高め&quot;},
    ib:{center:&quot;知性・感性&quot;, left:&quot;知性&quot;, right:&quot;感性&quot;},
    ob:{center:&quot;組織・個人&quot;, left:&quot;個人&quot;, right:&quot;組織&quot;}
  };
  const rowOrder = {
    stp:[&quot;core&quot;, &quot;Sd&quot;, &quot;Td&quot;, &quot;Pd&quot;],
    secondary:[&quot;St&quot;, &quot;ib&quot;, &quot;ob&quot;]
  };
  const invalidStatuses = new Set([
    &quot;unidentified&quot;, &quot;model_not_validated&quot;, &quot;sensitivity_unstable&quot;, &quot;insufficient_independent_variation&quot;
  ]);

  DATA.forEach(d =&gt; {
    const option = document.createElement(&quot;option&quot;);
    option.value = d.s;
    option.textContent = &quot;slot &quot; + d.s + &quot; · &quot; + d.m;
    if (d.s === 5) option.selected = true;
    select.appendChild(option);
  });

  function num(value) {
    return value == null ? &quot;—&quot; : (value &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + value.toFixed(2);
  }
  function statusJa(value) {
    return ({
      supported:&quot;支持&quot;,
      suggestive:&quot;示唆&quot;,
      unclear:&quot;不明&quot;,
      unidentified:&quot;識別不能&quot;,
      model_not_validated:&quot;検証不成立&quot;,
      sensitivity_unstable:&quot;感度不安定&quot;,
      insufficient_independent_variation:&quot;独立変動不足&quot;
    })[value] || value;
  }
  function directionText(row, value) {
    const meta = rowMeta[row.f];
    if (!meta || !value || invalidStatuses.has(value.st)) return &quot;判定不可&quot;;
    const effect = row.f === &quot;ib&quot; ? -value.e : value.e;
    if (Math.abs(effect) &lt; .01) return &quot;ほぼ中立&quot;;
    const direction = effect &lt; 0 ? meta.left : meta.right;
    if (row.f === &quot;core&quot;) return &quot;S/T/P&quot; + direction;
    if (row.f === &quot;St&quot;) return &quot;スタミナ&quot; + direction;
    return row.f === &quot;ib&quot; || row.f === &quot;ob&quot; ? direction + &quot;寄り&quot; : direction;
  }
  function sectionSummary(rows) {
    const byStrength = status =&gt; rows
      .filter(row =&gt; row.co.st === status)
      .sort((a, b) =&gt; Math.abs(b.co.e) - Math.abs(a.co.e))
      .map(row =&gt; directionText(row, row.co));
    const supported = byStrength(&quot;supported&quot;);
    const suggestive = byStrength(&quot;suggestive&quot;);
    const parts = [];
    if (supported.length) parts.push(supported.join(&quot;・&quot;) + &quot;（支持）&quot;);
    if (suggestive.length) parts.push(suggestive.join(&quot;・&quot;) + &quot;（示唆）&quot;);
    if (parts.length) return parts.join(&quot; ／ &quot;);
    if (rows.every(row =&gt; [&quot;unidentified&quot;, &quot;model_not_validated&quot;, &quot;insufficient_independent_variation&quot;].includes(row.co.st))) {
      return &quot;独立効果を検証できず&quot;;
    }
    return &quot;明確な統合要因なし&quot;;
  }
  function stpShareSummary(share) {
    const values = share &amp;&amp; share.p ? share.p : {};
    return [&quot;S&quot;, &quot;T&quot;, &quot;P&quot;]
      .sort((left, right) =&gt; (values[right] || 0) - (values[left] || 0))
      .map(key =&gt; key + &quot; &quot; + (values[key] || 0) + &quot;%&quot;)
      .join(&quot;・&quot;);
  }
  function showTip(event, row, key) {
    const value = row[key];
    let detail = &quot;&quot;;
    if (key === &quot;co&quot;) {
      detail = &quot;&lt;br&gt;&lt;span&gt;採用: &quot; + (value.src || &quot;なし&quot;) + &quot;&lt;/span&gt;&quot;;
    } else {
      detail = &quot;&lt;br&gt;&lt;span&gt;元の観測範囲 &quot; + num(value.q1) + &quot; → &quot; + num(value.q3) + &quot;&lt;/span&gt;&quot; +
        &quot;&lt;br&gt;&lt;span&gt;独立変動 &quot; + Math.round((value.ir || 0) * 100) + &quot;% ／ held-out R² &quot; + (value.cv == null ? &quot;—&quot; : value.cv.toFixed(2)) + &quot;&lt;/span&gt;&quot;;
    }
    tip.innerHTML = &quot;&lt;strong&gt;&quot; + row.label + &quot; · &quot; + defs[key].name + &quot;&lt;/strong&gt;&quot; +
      &quot;方向: &quot; + directionText(row, value) + &quot;&lt;br&gt;&lt;span&gt;効果 &quot; + num(value.e) + &quot; SD&lt;/span&gt;&quot; +
      &quot;&lt;br&gt;&lt;span&gt;95%区間 &quot; + num(value.l) + &quot; ～ &quot; + num(value.h) + &quot;&lt;/span&gt;&quot; +
      &quot;&lt;br&gt;&lt;span&gt;判定: &quot; + statusJa(value.st) + &quot;&lt;/span&gt;&quot; + detail;
    const box = root.getBoundingClientRect();
    const maxLeft = Math.max(4, box.width - Math.min(260, box.width - 16));
    tip.style.left = Math.min(maxLeft, Math.max(4, event.clientX - box.left + 10)) + &quot;px&quot;;
    tip.style.top = Math.max(4, event.clientY - box.top - 18) + &quot;px&quot;;
    tip.classList.add(&quot;on&quot;);
  }
  function hideTip() { tip.classList.remove(&quot;on&quot;); }

  function drawStpShares(container, shares) {
    const series = Object.keys(defs).filter(key =&gt; active.has(key));
    container.replaceChildren();
    series.forEach(key =&gt; {
      const value = shares[key];
      const percentages = value.p || {S:0, T:0, P:0};
      const row = document.createElement(&quot;section&quot;);
      row.className = &quot;stp-share-row&quot;;
      const head = document.createElement(&quot;div&quot;);
      head.className = &quot;stp-share-head&quot;;
      const name = document.createElement(&quot;span&quot;);
      name.textContent = defs[key].name;
      const status = document.createElement(&quot;span&quot;);
      status.className = &quot;stp-share-status&quot;;
      const baseStatus = value.st === &quot;model_not_validated&quot; ? &quot;参考&quot; : statusJa(value.st);
      const sourceDetail = key === &quot;co&quot; &amp;&amp; value.src ? &quot;・&quot; + value.src :
        (key !== &quot;co&quot; &amp;&amp; Number.isFinite(value.cv) ? &quot;・CV &quot; + value.cv.toFixed(2) : &quot;&quot;);
      status.textContent = baseStatus + sourceDetail;
      head.append(name, status);
      row.appendChild(head);
      const grid = document.createElement(&quot;div&quot;);
      grid.className = &quot;stp-axis-grid&quot;;
      const scale = document.createElement(&quot;div&quot;);
      scale.className = &quot;stp-axis-scale&quot;;
      [&quot;0&quot;, &quot;50&quot;, &quot;100%&quot;].forEach(mark =&gt; {
        const tick = document.createElement(&quot;span&quot;);
        tick.textContent = mark;
        scale.appendChild(tick);
      });
      grid.appendChild(scale);
      [&quot;S&quot;, &quot;T&quot;, &quot;P&quot;].forEach(feature =&gt; {
        const percent = percentages[feature] || 0;
        const label = document.createElement(&quot;span&quot;);
        label.className = &quot;stp-axis-label&quot;;
        label.dataset.feature = feature;
        label.textContent = feature;
        const track = document.createElement(&quot;div&quot;);
        track.className = &quot;stp-axis-track&quot;;
        track.setAttribute(&quot;role&quot;, &quot;progressbar&quot;);
        track.setAttribute(&quot;aria-label&quot;, defs[key].name + &quot; &quot; + feature + &quot; 寄与度&quot;);
        track.setAttribute(&quot;aria-valuemin&quot;, &quot;0&quot;);
        track.setAttribute(&quot;aria-valuemax&quot;, &quot;100&quot;);
        track.setAttribute(&quot;aria-valuenow&quot;, String(percent));
        const fill = document.createElement(&quot;div&quot;);
        fill.className = &quot;stp-axis-fill&quot;;
        fill.dataset.feature = feature;
        fill.style.width = percent + &quot;%&quot;;
        track.appendChild(fill);
        const number = document.createElement(&quot;span&quot;);
        number.className = &quot;stp-axis-value&quot;;
        number.textContent = percent + &quot;%&quot;;
        const axisRow = document.createElement(&quot;div&quot;);
        axisRow.className = &quot;stp-axis-row&quot;;
        axisRow.append(label, track, number);
        grid.appendChild(axisRow);
      });
      row.appendChild(grid);
      container.appendChild(row);
    });
    const note = document.createElement(&quot;p&quot;);
    note.className = &quot;stp-share-note&quot;;
    note.textContent = &quot;各系列でS＋T＋P＝100%。負の寄与は置かず、0%はこのサンプルで独立寄与を分離できなかったことを示す。&quot;;
    container.appendChild(note);
  }

  function drawPanel(svgNode, rows, section, mobile) {
    rows = rowOrder[section].map(key =&gt; rows.find(row =&gt; row.f === key)).filter(Boolean);
    const svg = d3.select(svgNode);
    const width = Math.max(300, Math.min(root.clientWidth, window.innerWidth));
    const margin = {top:4, right:mobile ? 8 : 14, bottom:28, left:mobile ? 86 : 112};
    const rowHeight = mobile ? 62 : 66;
    const height = margin.top + margin.bottom + rows.length * rowHeight;
    const innerW = width - margin.left - margin.right;
    const innerH = height - margin.top - margin.bottom;
    svg.style(&quot;height&quot;, height + &quot;px&quot;).attr(&quot;viewBox&quot;, &quot;0 0 &quot; + width + &quot; &quot; + height);
    svg.selectAll(&quot;*&quot;).remove();

    const values = [];
    rows.forEach(row =&gt; Object.keys(defs).forEach(key =&gt; {
      if (active.has(key) &amp;&amp; Number.isFinite(row[key].e) &amp;&amp; !invalidStatuses.has(row[key].st)) {
        values.push(Math.abs(row.f === &quot;ib&quot; ? -row[key].e : row[key].e));
      }
    }));
    const cap = Math.max(.1, Math.ceil((d3.max(values) || .1) * 20) / 20);
    const x = d3.scaleLinear().domain([-cap, cap]).range([6, innerW - 6]);
    const y = d3.scaleBand().domain(rows.map(row =&gt; row.f)).range([0, innerH]).padding(.08);
    const g = svg.append(&quot;g&quot;).attr(&quot;transform&quot;, &quot;translate(&quot; + margin.left + &quot;,&quot; + margin.top + &quot;)&quot;);
    const trackY = row =&gt; y(row.f) + y.bandwidth() / 2 + 11;
    g.selectAll(&quot;.direction-track&quot;).data(rows).join(&quot;line&quot;)
      .attr(&quot;class&quot;, &quot;direction-track&quot;).attr(&quot;x1&quot;, 6).attr(&quot;x2&quot;, innerW - 6)
      .attr(&quot;y1&quot;, trackY).attr(&quot;y2&quot;, trackY);
    g.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;zero&quot;)
      .attr(&quot;x1&quot;, x(0)).attr(&quot;x2&quot;, x(0)).attr(&quot;y1&quot;, 0).attr(&quot;y2&quot;, innerH);
    g.selectAll(&quot;.row-label&quot;).data(rows).join(&quot;text&quot;)
      .attr(&quot;class&quot;, &quot;row-label&quot;).attr(&quot;x&quot;, -8)
      .attr(&quot;y&quot;, row =&gt; y(row.f) + y.bandwidth() / 2 - 6)
      .attr(&quot;text-anchor&quot;, &quot;end&quot;).text(row =&gt; rowMeta[row.f].center);
    g.selectAll(&quot;.row-status&quot;).data(rows).join(&quot;text&quot;)
      .attr(&quot;class&quot;, row =&gt; &quot;row-status status-&quot; + row.co.st).attr(&quot;x&quot;, -8)
      .attr(&quot;y&quot;, row =&gt; y(row.f) + y.bandwidth() / 2 + 11)
      .attr(&quot;text-anchor&quot;, &quot;end&quot;).text(row =&gt; statusJa(row.co.st));
    g.selectAll(&quot;.endpoint-left&quot;).data(rows).join(&quot;text&quot;)
      .attr(&quot;class&quot;, &quot;endpoint-label endpoint-left&quot;).attr(&quot;x&quot;, 0)
      .attr(&quot;y&quot;, row =&gt; y(row.f) + y.bandwidth() / 2 - 6)
      .attr(&quot;text-anchor&quot;, &quot;start&quot;).text(row =&gt; rowMeta[row.f].left);
    g.selectAll(&quot;.endpoint-right&quot;).data(rows).join(&quot;text&quot;)
      .attr(&quot;class&quot;, &quot;endpoint-label endpoint-right&quot;).attr(&quot;x&quot;, innerW)
      .attr(&quot;y&quot;, row =&gt; y(row.f) + y.bandwidth() / 2 - 6)
      .attr(&quot;text-anchor&quot;, &quot;end&quot;).text(row =&gt; rowMeta[row.f].right);

    Object.keys(defs).forEach(key =&gt; {
      if (!active.has(key)) return;
      const definition = defs[key];
      const visible = rows.filter(row =&gt; {
        const value = row[key];
        return Number.isFinite(value.e) &amp;&amp; !invalidStatuses.has(value.st);
      });
      const marks = g.append(&quot;g&quot;).attr(&quot;data-series&quot;, key)
        .selectAll(&quot;g&quot;).data(visible).join(&quot;g&quot;)
        .attr(&quot;class&quot;, row =&gt; &quot;status-&quot; + row[key].st)
        .attr(&quot;transform&quot;, row =&gt; &quot;translate(0,&quot; + (trackY(row) + definition.offset) + &quot;)&quot;);
      marks.append(&quot;circle&quot;).attr(&quot;class&quot;, &quot;point&quot;)
        .attr(&quot;cx&quot;, row =&gt; x(row.f === &quot;ib&quot; ? -row[key].e : row[key].e)).attr(&quot;r&quot;, key === &quot;co&quot; ? 4.2 : 3.4)
        .attr(&quot;fill&quot;, definition.color);
      marks.append(&quot;circle&quot;).attr(&quot;data-hit&quot;, &quot;&quot;)
        .attr(&quot;cx&quot;, row =&gt; x(row.f === &quot;ib&quot; ? -row[key].e : row[key].e)).attr(&quot;r&quot;, 18)
        .attr(&quot;fill&quot;, &quot;transparent&quot;).style(&quot;cursor&quot;, &quot;pointer&quot;)
        .attr(&quot;aria-label&quot;, row =&gt; row.label + &quot; &quot; + defs[key].name + &quot; &quot; + directionText(row, row[key]) + &quot; &quot; + statusJa(row[key].st))
        .on(&quot;pointerenter&quot;, (event, row) =&gt; showTip(event, row, key))
        .on(&quot;pointermove&quot;, (event, row) =&gt; showTip(event, row, key))
        .on(&quot;pointerleave&quot;, hideTip)
        .on(&quot;click&quot;, (event, row) =&gt; { event.stopPropagation(); showTip(event, row, key); });
    });
    g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;x&quot;)
      .attr(&quot;x&quot;, innerW / 2).attr(&quot;y&quot;, innerH + 22).attr(&quot;text-anchor&quot;, &quot;middle&quot;)
      .text(&quot;← 要求方向 ｜ 中心から遠いほど重要度が高い →&quot;);
  }

  function draw() {
    const datum = DATA.find(row =&gt; row.s === +select.value) || DATA[0];
    const mobile = root.clientWidth &lt; 520;
    root.querySelector(&quot;#factor-model&quot;).textContent =
      &quot;モデル選手: &quot; + datum.m + &quot; ／ CC n=&quot; + datum.n.cc + &quot; ／ Rohm n=&quot; + datum.n.rh +
      &quot; ／ SS +0.083・CC +0.109補正&quot;;
    root.querySelector(&quot;#stp-summary&quot;).textContent = stpShareSummary(datum.stpShare.co);
    root.querySelector(&quot;#secondary-summary&quot;).textContent = sectionSummary(datum.sections.secondary);
    drawStpShares(root.querySelector(&quot;#stp-numbers&quot;), datum.stpShare);
    drawPanel(root.querySelector(&quot;#secondary-chart&quot;), datum.sections.secondary, &quot;secondary&quot;, mobile);
    const note = root.querySelector(&quot;#position-note&quot;);
    note.hidden = !datum.note;
    note.textContent = datum.note ? &quot;slot外適性: &quot; + datum.note : &quot;&quot;;
  }

  select.addEventListener(&quot;change&quot;, draw);
  root.querySelectorAll(&quot;.legend button&quot;).forEach(button =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      const key = button.dataset.series;
      if (active.has(key) &amp;&amp; active.size &gt; 1) active.delete(key);
      else active.add(key);
      button.setAttribute(&quot;aria-pressed&quot;, active.has(key) ? &quot;true&quot; : &quot;false&quot;);
      draw();
    });
  });
  let frame = 0;
  new ResizeObserver(() =&gt; {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(draw);
  }).observe(root);
  draw();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
