<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebSoccer Ordinary - Player Inventory</title>
  <meta property="og:title" content="WebSoccer Ordinary - Player Inventory" />
  <meta property="og:site_name" content="WebSoccer Ordinary" />
  <meta name="twitter:title" content="WebSoccer Ordinary - Player Inventory" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=20260324-013653" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=20260324-013653" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=20260324-013653" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png?v=20260324-013653" />
  <link rel="shortcut icon" href="./favicon.ico?v=20260324-013653" />
  <link rel="stylesheet" href="./style.css?v=20260810-player-inventory-v10" />
</head>
<body class="stocks-page">
  <main class="container">
    <header class="hero">
      <button id="menuButton" type="button" class="menu-button" aria-label="メニュー">☰</button>
      <div id="menuPanel" class="menu-panel">
        <div id="menuLoginId" class="menu-login-id" hidden></div>
        <button id="playersButton" type="button" class="menu-item">Players</button>
        <button id="coachesButton" type="button" class="menu-item">Coaches</button>
        <button id="formationsButton" type="button" class="menu-item">Formations</button>
        <button id="collectionsButton" type="button" class="menu-item">Collections</button>
        <button id="myTeamButton" type="button" class="menu-item">My Team</button>
        <button id="stocksButton" type="button" class="menu-item is-current" aria-current="page">Player Inventory</button>
        <button id="loginButton" type="button" class="menu-item">Login</button>
        <button id="logoutButton" type="button" class="menu-item logout" hidden>Logout</button>
      </div>
      <h1>WebSoccer Ordinary</h1>
      <p class="meta" id="metaText">Loading inventory...</p>
    </header>

    <section class="panel stock-overview-panel">
      <p class="stock-scope-copy">A–Xの将来割当を除いたNumbered Team在庫を検索します</p>
      <div id="stockSummary" class="stock-summary" aria-live="polite"></div>
      <div class="stock-inline-search">
        <label class="label" for="stockQuery">Player Name</label>
        <div class="stock-suggest-wrap">
          <input
            id="stockQuery"
            type="search"
            enterkeyhint="search"
            placeholder="選手名を入力"
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="stockSuggestions"
            aria-expanded="false"
          />
          <div id="stockSuggestions" class="stock-suggestions" role="listbox" hidden></div>
        </div>
        <p class="stock-search-hint">かな入力対応。候補を選ぶと全期在庫を表示します。</p>
      </div>
    </section>

    <section class="panel">
      <div class="result-head stock-result-head">
        <h2>Held Cards</h2>
        <span id="stockCount">0 types / 0 cards</span>
      </div>
      <div id="stockList" class="stock-list" aria-live="polite">
        <div class="stock-empty">選手名を入力してください。</div>
      </div>
      <p class="stock-data-note">RESERVEは外部予備として確保している在庫です。検索・表示には常に含めますが、トレードに使う場合は予備枠の不足に注意してください。各チームの当期トレード残枠・出品中・交渉中の状態はまだ反映していません。</p>
    </section>
  </main>

  <script src="./stocks.js?v=20260811-player-inventory-v16"></script>
</body>
</html>
