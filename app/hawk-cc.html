  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png?v=20260324-013653" />

</head>
<body class="hawk-cc-page">
  <main class="container">
    <header class="hero">
      <button id="menuButton" type="button" class="menu-button" aria-label="メニュー" aria-expanded="false">☰</button>
      <div id="menuPanel" class="menu-panel">
        <div id="menuLoginId" class="menu-login-id" hidden></div>
        <a href="./index.html" class="menu-item menu-link">Players</a>
        <a href="./coaches.html" class="menu-item menu-link">Coaches</a>
        <a href="./formations.html" class="menu-item menu-link">Formations</a>
        <a href="./hawk-cc.html" class="menu-item menu-link is-current" aria-current="page">Hawk CC</a>
        <a href="./collections.html" class="menu-item menu-link">Collections</a>
        <a href="./myteam.html" class="menu-item menu-link">My Team</a>
        <a href="./stocks.html" class="menu-item menu-link">Inventory</a>
        <button id="loginButton" type="button" class="menu-item">Login</button>
        <button id="logoutButton" type="button" class="menu-item logout" hidden>Logout</button>
      </div>
      <h1>WebSoccer Ordinary</h1>
      <p class="meta" id="metaText">Loading Hawk CC...</p>
    </header>

    <section class="panel cc-overview-panel">
      <div class="cc-title-row">
        <div>
          <span class="cc-eyebrow">HAWK WORLD</span>
          <h2>Champions Cup</h2>
        </div>
        <span id="ccStatus" class="cc-status is-loading">Loading</span>
      </div>
      <div id="ccSummary" class="cc-summary" aria-live="polite"></div>
      <p class="cc-update-note">毎日01:30 JSTに取得したデータを自動掲載します。</p>
    </section>

    <nav class="cc-stage-tabs" aria-label="Champions Cup表示切替">
      <button type="button" class="cc-stage-tab is-active" data-cc-view="groups" aria-selected="true">
        Group Stage <span id="groupTabCount">0</span>
      </button>
      <button type="button" class="cc-stage-tab" data-cc-view="tournament" aria-selected="false">
        Tournament <span id="tournamentTabCount">0</span>
      </button>
    </nav>

    <section id="groupsPanel" class="cc-view-panel" aria-labelledby="groupStageHeading">
      <div class="result-head cc-section-head">
        <h2 id="groupStageHeading">Group Stage</h2>
        <span id="groupStageMeta">Loading...</span>
      </div>
      <div id="ccGroupGrid" class="cc-group-grid" aria-live="polite"></div>
    </section>

    <section id="tournamentPanel" class="cc-view-panel" aria-labelledby="tournamentHeading" hidden>
      <div class="result-head cc-section-head">
        <h2 id="tournamentHeading">Tournament</h2>
        <span id="tournamentMeta">Loading...</span>
      </div>
      <div id="ccTournament" class="cc-tournament" aria-live="polite"></div>
    </section>
  </main>

  <noscript>Hawk CCの表示にはJavaScriptが必要です。</noscript>
  <script src="./hawk-cc.js?v=20260831-hawk-cc-v1"></script>
</body>
</html>
